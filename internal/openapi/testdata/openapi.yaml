components:
  schemas:
    AcceptedOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AcceptedOutputBody.json
          format: uri
          readOnly: true
          type: string
        message:
          type: string
        token:
          type: string
      required:
        - message
      type: object
    ConfirmEmailInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ConfirmEmailInputBody.json
          format: uri
          readOnly: true
          type: string
        token:
          description: Email confirmation token
          type: string
      required:
        - token
      type: object
    CreateStubInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateStubInputBody.json
          format: uri
          readOnly: true
          type: string
        name:
          description: Name for the stub
          examples:
            - my-stub
          type: string
      required:
        - name
      type: object
    CredentialsInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CredentialsInputBody.json
          format: uri
          readOnly: true
          type: string
        email:
          description: Account email address
          examples:
            - ada@example.com
          type: string
        password:
          description: Account password
          examples:
            - correct horse battery staple
          type: string
      required:
        - email
        - password
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    HealthzOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthzOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    MessageOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/MessageOutputBody.json
          format: uri
          readOnly: true
          type: string
        message:
          type: string
      required:
        - message
      type: object
    PasswordResetConfirmInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PasswordResetConfirmInputBody.json
          format: uri
          readOnly: true
          type: string
        password:
          description: New account password
          type: string
        token:
          description: Password reset token
          type: string
      required:
        - token
        - password
      type: object
    PasswordResetInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PasswordResetInputBody.json
          format: uri
          readOnly: true
          type: string
        email:
          description: Account email address
          examples:
            - ada@example.com
          type: string
      required:
        - email
      type: object
    ReadyzOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ReadyzOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    StubOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/StubOutputBody.json
          format: uri
          readOnly: true
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
        - createdAt
      type: object
    TestInjectionInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TestInjectionInputBody.json
          format: uri
          readOnly: true
          type: string
        bad-name:
          description: Property name that is not a valid identifier
          type: string
        name:
          description: Name for the stub
          type: string
      type: object
    UpdateWidgetInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdateWidgetInputBody.json
          format: uri
          readOnly: true
          type: string
        count:
          description: Count of items
          type: integer
        email:
          description: Contact email
          type: string
        enabled:
          description: Whether the widget is enabled
          type: boolean
        meta:
          description: Arbitrary metadata
          type: object
        note:
          description: Optional note
          type: string
        password:
          description: Access password
          type: string
        price:
          description: Price in cents
          type: number
        tags:
          description: Tags for the widget
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - count
        - email
        - enabled
        - password
      type: object
    UserBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UserBody.json
          format: uri
          readOnly: true
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        id:
          type: string
        permissions:
          items:
            type: string
          type:
            - array
            - "null"
        role:
          type: string
      required:
        - id
        - email
        - role
        - permissions
        - emailVerified
      type: object
    WidgetOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/WidgetOutputBody.json
          format: uri
          readOnly: true
          type: string
        count:
          type: integer
        enabled:
          type: boolean
        name:
          type: string
        tags:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - count
        - enabled
        - name
        - tags
      type: object
  securitySchemes:
    session:
      description: Opaque session issued by POST /users/login.
      in: cookie
      name: session
      type: apiKey
info:
  title: Backend API
  version: 0.1.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Health check
      tags:
        - System
    head:
      operationId: head-healthz
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Health check (HEAD)
      tags:
        - System
  /readyz:
    get:
      operationId: readyz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyzOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Readiness check
      tags:
        - System
  /stubs:
    post:
      operationId: create-stub
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStubInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StubOutputBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - session: []
      summary: Create a stub
      tags:
        - Example
  /stubs/{id}:
    get:
      operationId: get-stub
      parameters:
        - description: Stub id
          in: path
          name: id
          required: true
          schema:
            description: Stub id
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StubOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a stub by id
      tags:
        - Example
  /test-injection:
    post:
      operationId: test-injection
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestInjectionInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Test "injection" safety
      tags:
        - Example
  /users/confirm-email:
    post:
      operationId: confirm-user-email
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmEmailInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Confirm an email address
      tags:
        - Users
  /users/login:
    post:
      description: Issues a session and sets the session cookie.
      operationId: login-user
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Log in
      tags:
        - Users
  /users/logout:
    post:
      description: Revokes the current session and clears the session cookie.
      operationId: logout-user
      parameters:
        - description: Session cookie issued by POST /users/login
          in: cookie
          name: session
          schema:
            description: Session cookie issued by POST /users/login
            type: string
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - session: []
      summary: Log out
      tags:
        - Users
  /users/me:
    get:
      operationId: get-current-user
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - session: []
      summary: Get the current user
      tags:
        - Users
  /users/password-reset:
    post:
      description: Always responds the same way whether or not the email is registered.
      operationId: request-password-reset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Request a password reset
      tags:
        - Users
  /users/password-reset/confirm:
    post:
      operationId: confirm-password-reset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set a new password with a reset token
      tags:
        - Users
  /users/register:
    post:
      description: Responds 202 with a deliberately generic message. An address that is already registered is rejected with 409, so this endpoint does not conceal whether an email exists.
      operationId: register-user
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Register an account
      tags:
        - Users
  /widgets:
    get:
      operationId: list-widgets
      parameters:
        - description: Page number
          in: query
          name: page
          required: true
          schema:
            description: Page number
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/WidgetOutputBody"
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List widgets
      tags:
        - Example
  /widgets/{slug}:
    put:
      operationId: update-widget
      parameters:
        - description: Widget slug
          in: path
          name: slug
          required: true
          schema:
            description: Widget slug
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWidgetInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a widget
      tags:
        - Example
  /widgets/{slug}/rename:
    post:
      operationId: rename-widget
      parameters:
        - description: Widget slug
          in: path
          name: slug
          required: true
          schema:
            description: Widget slug
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/definitions/RenameWidgetInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Rename a widget
      tags:
        - Example
  /widgets/{slug}/upload:
    post:
      operationId: upload-widget
      parameters:
        - description: Widget slug
          in: path
          name: slug
          required: true
          schema:
            description: Widget slug
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Upload a widget asset
      tags:
        - Example
